<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/jquery-4.0.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Shop cards Practice</title>
</head>
<body>

    <div class="titleDiv p-3">
        <h1 class="text-start alert alert-info"><span class="text-warning">ADMIN</span> PAGE</h1>
    </div>

    <div class="alert alert-warning header text-end rounded p-3 ms-3 me-3 mt-1">
        <button id="mgBtn" class="btn btn-warning text-dark border border-info shineEffect">Start management</button>

        <div id="AdminDiv" class="AdminDiv text-end alert alert-light mt-2">
            <div class="inpDiv d-inline-block text-center p-3">
                <input id="cardName" class="form-control mt-1" placeholder="Card name" type="text">
                <input id="cardImgSrc" class="form-control mt-1" placeholder="Card image source" type="text">
                <input id="cardPrice" class="form-control mt-1" placeholder="Card price" type="number">
                <button id="saveBtn" class="btn btn-dark text-light shineEffect pe-4 ps-4 border border-light mt-2">Save</button>
            </div>
        </div>
    </div>

        <div id="cardsArea" class="text-center">

            <div class="row g-4">

                
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 m-3">
        
                    <div class="productCard bg-light rounded border border-warning h-100 p-3">
        
                        
                        <div class="imgDiv text-center">
                            <img
                                class="cardImg rounded"
                                src="img/mouseImg.jpg"
                                alt="Mouse Product"
                            >
                        </div>
        
                        
                        <div class="cardCaption text-center mt-3">
        
                            <p class="productCaption mb-2">
                                This is a mouse product
                            </p>
        
                            <p class="h4 mb-3">
                                19.99$
                            </p>
        
                        </div>
        
                        
                        <div class="text-center">
                            <button class="btn btn-success border-warning shineEffect px-4">
                                BUY
                            </button>
                        </div>
        
                    </div>
        
                </div>

        
            </div>

        </div>


<script src="js/app.js"></script>
</body>
</html>
