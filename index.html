<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shop Cards Practice</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================
         PAGE TITLE
    ========================== -->

    <div class="container-fluid p-3">

        <h1 class="pageTitle alert alert-info mb-0">
            <span class="text-warning">ADMIN</span>
            PAGE
        </h1>

    </div>



    <!-- =========================
         MANAGEMENT AREA
    ========================== -->

    <div class="container-fluid">

        <div class="managementBox alert alert-warning">

            <div class="text-end">

                <button
                    id="mgBtn"
                    class="btn btn-warning border border-info"
                >
                    Start Management
                </button>

            </div>


            <!-- Admin Form -->

            <div
                id="AdminDiv"
                class="adminPanel alert alert-light mt-3 mb-0"
            >

                <div class="adminForm">

                    <input
                        id="cardName"
                        class="form-control"
                        type="text"
                        placeholder="Card name"
                    >

                    <input
                        id="cardImgSrc"
                        class="form-control"
                        type="text"
                        placeholder="Card image name"
                    >

                    <input
                        id="cardPrice"
                        class="form-control"
                        type="number"
                        placeholder="Card price"
                    >

                    <button
                        id="saveBtn"
                        class="btn btn-dark"
                    >
                        Save Product
                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         PRODUCTS
    ========================== -->

    <main class="container py-4">

        <div
            id="cardsArea"
            class="row g-4"
        >

            <!--
                Cards will be added here
                using JavaScript.
            -->


            <!-- Example Card -->

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                <div class="productCard">

                    <div class="imageWrapper">

                        <img
                            class="cardImg"
                            src="img/mouseImg.jpg"
                            alt="Mouse Product"
                        >

                    </div>


                    <div class="cardContent">

                        <h5 class="productName">
                            This is a mouse product
                        </h5>

                        <p class="productPrice">
                            19.99$
                        </p>

                    </div>


                    <button
                        class="btn btn-success buyBtn"
                    >
                        BUY
                    </button>

                </div>

            </div>


        </div>

    </main>



    <!-- jQuery -->

    <script
        src="js/jquery-4.0.0.min.js"
    ></script>


    <!-- JavaScript -->

    <script
        src="js/app.js"
    ></script>


</body>

</html>
